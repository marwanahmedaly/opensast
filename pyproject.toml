[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evidence-grounded-aisast"
version = "0.2.0"
description = "Evidence-grounded AI-assisted static analysis for selected Python CWEs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "httpx>=0.27,<1",
  "PyYAML>=6,<7",
  "packaging>=23,<27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "jsonschema>=4"]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
install = ["zstandard>=0.23,<1"]

[project.scripts]
aisast = "aisast.cli:main"
opensast = "aisast.product.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aisast"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "plan7_assertions(ids): stable assertion or fixture IDs recorded in the Plan 7 test ledger",
]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["/src", "/config/plan7/current-queries.json", "/config/plan7/ql-models", "/config/codeql-xss-models", "/hatch_build.py", "/pyproject.toml", "/README.md", "/scripts/install.sh", "/docs/installation.md"]
